# Generic CI pipeline. Runs on every push and PR to main, and can be triggered
# manually from the Actions tab (workflow_dispatch).
#
# HOW TO CONFIGURE FOR YOUR PROJECT
# ---------------------------------
# Everything you normally need to change lives in the "CONFIG" section below:
#   - os / python-version: edit the matrix (add "windows-latest", "3.12", etc.)
#   - INSTALL_CMD / LINT_CMD / FORMAT_CMD / TEST_CMD: set to your project's
#     commands from tech-stack.md (npm, cargo, pytest, etc.)
#   - RUN_SECRET_SCAN: set to "true" to enable the gitleaks secret scan step
#
# HOW TO EXTEND
# -------------
# Add extra steps inside the job below (e.g. build, type-check, deploy).
# Keep the trigger/job/checkout structure as-is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # --- CONFIG: OS + Python versions (add/remove entries as needed) ---
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    # --- CONFIG: commands for your stack (from tech-stack.md) ---
    env:
      INSTALL_CMD: pip install -r requirements.lock
      LINT_CMD: ruff check .
      FORMAT_CMD: ruff format --check .
      TEST_CMD: pytest -q -m "not slow"
      RUN_SECRET_SCAN: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the PR's commit range, so it needs full history

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: ${{ env.INSTALL_CMD }}

      # The lock file pins dependencies only; tests import the phishguard package itself.
      - name: Install project
        run: pip install -e . --no-deps

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: ${{ env.LINT_CMD }}

      - name: Format check
        run: ${{ env.FORMAT_CMD }}

      - name: Run tests
        run: ${{ env.TEST_CMD }}

      - name: Web lint
        run: npm run lint
        working-directory: web

      - name: Web tests
        run: npm test
        working-directory: web

      # Belt-and-suspenders with GitHub's built-in secret scanning.
      # Enable by setting RUN_SECRET_SCAN to "true" above.
      - name: Secret scan
        if: env.RUN_SECRET_SCAN == 'true'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}