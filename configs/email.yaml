# Email model training config. Read by phishguard.training.*
# Corpora (downloaded once by hand, never by the app):
#   Nazario phishing corpus, CC-BY-4.0, https://monkey.org/~jose/phishing/ (phishing-YYYY mboxes)
#   Apache SpamAssassin public corpus 20030228, ham only: easy_ham, easy_ham_2, hard_ham
#   Enron email dataset (CMU, 2015-05-07 maildir), a seeded sample is used as ham
raw_dir: data/raw/email
processed_dir: data/processed
reports_dir: reports
models_dir: models
version: v1
seed: 42
test_fraction: 0.2        # locked test = 1 of 5 grouped folds of everything except the newest year
n_folds: 5                # grouped CV on dev
target_fpr: 0.01
target_fpr_low: 0.10
enron_sample: 6000        # about 2x the kept Nazario mail (3,042 in the first audit); fixed, see ADR 0007
exclude_features: [n_links, n_link_domains, has_html]  # corpus-era artefacts, see ADR 0007
sources:                  # SHA-256 of every raw file the data is built from
  nazario/phishing-2015.mbox: 7523e62a5e6e4ee8134ab8b1a628e423097a7779e1003b28422864aa34f1c319
