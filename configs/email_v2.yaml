# Email v2 training config (ADR 0009). Read by phishguard.training.prepare_email_v2 and train.
# Ham: automated mail from consenting mailboxes, converted to .eml under modern_dir/<person_N>/
# (git-ignored, never committed). Phishing: the same Nazario corpus and temporal hold-out as v1.
raw_dir: data/raw/email
modern_dir: data/raw/email_modern/v2_eml
holdout_dir: data/raw/email_modern/own   # the 123-message held-out sample: never trained on
holdout_skip: v2                         # the raw v2 mbox folder lives below holdout_dir
processed_dir: data/processed
reports_dir: reports
models_dir: models
version: v2
dev_file: email_v2_dev.csv
mask: sender          # the model reads text with the sender's name and brand hidden
seed: 42
test_fraction: 0.2
n_folds: 5
target_fpr: 0.01
target_fpr_low: 0.10
sender_cap: 10
exclude_features: [n_links, n_link_domains, has_html]
sources:                  # Nazario only; modern mail is not hashed (private)
  nazario/phishing-2015.mbox: 7523e62a5e6e4ee8134ab8b1a628e423097a7779e1003b28422864aa34f1c319
