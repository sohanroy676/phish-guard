# URL model training config. Read by phishguard.training.*
raw_path: data/raw/PhiUSIIL_Phishing_URL_Dataset.csv
raw_sha256: null          # fill in after the first audit; prepare refuses a different file
processed_dir: data/processed
reports_dir: reports
models_dir: models
version: v1
seed: 42
test_fraction: 0.2        # locked test = 1 of 5 grouped folds
n_folds: 5                # grouped CV on dev
target_fpr: 0.01          # t_high: dev out-of-fold FPR <= this
target_recall_low: 0.95   # t_low: highest threshold keeping this phishing recall
exclude_features: []      # e.g. [is_https] if the audit shows scheme leakage

grids:
  lr_char:
    C: [1.0, 10.0]
    ngram_range: [[2, 4]]
    max_features: [200000]
  rf_hand:
    n_estimators: [200]
    min_samples_leaf: [1, 3]
