[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Offline, explainable phishing risk scoring for URLs and emails"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic-settings",
    "python-multipart",
    "scikit-learn",
    "pandas",
    "numpy",
    "scipy",
    "tldextract",
    "shap",
    "argon2-cffi",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-socket", "httpx", "ruff", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phishguard.core.lists" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--allow-hosts=127.0.0.1,::1"
markers = ["slow: model-training tests, excluded from `make test`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
